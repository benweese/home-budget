# Claude reviews every ready (non-draft) PR opened by the repo owner. Review only: it can't push (contents: read).
# Fork PRs never run it (allow_fork_prs: false; pull_request, not pull_request_target).
# anthropics/claude-code-action and the oven-sh/setup-bun it uses are allow-listed by name in Settings → Actions;
# this file pins the exact SHA (the repo requires SHA pins), so every Dependabot bump is a PR to review.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) + the Claude GitHub App (OIDC → id-token).
# Docs: https://github.com/anthropics/claude-code-action (usage, security, "Automatic PR Code Review").
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Without the token the action skips its steps and reports success; fail loudly instead.
      - name: Check the Claude token is set
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN isn't set in this repo, so no review ran."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to a family cash-flow app on Cloudflare Workers + D1 (TypeScript monorepo, public repo).
            Read CLAUDE.md and README.md first. The PR branch is checked out. Check, in this order:
            1. Privacy: no real personal data (names, amounts, emails, phone, card or account numbers, addresses,
               credentials, the app's production domain; the public docs site at code.benweese.com/home-budget/ is fine) in code, tests, fixtures, docs, commit messages or the PR text, and no
               references to private trackers or issue numbers from elsewhere. Made-up data and example.com are fine.
            2. Money: amounts are integer cents, never floats.
            3. TypeScript: strict; no `as` casts or `any` to silence types (relax a compiler flag only with an ADR note).
            4. Accessibility: WCAG 2.2 AA and docs/accessibility.md (native controls, visible labels, no animation,
               44px targets, role/label first).
            5. wrangler.jsonc stays local only (no account IDs, secrets or production config).
            Then: workflows pin every action to a full commit SHA with a version comment; bugs, edge cases and
            missing tests in the changed code. CI runs the tests; don't run them.

            Keep it short: lead with what must change, then nits. Don't repeat what's fine.
            Use `gh pr comment` for one summary comment, and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific lines.
            Only post GitHub comments. Never push or edit files.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
